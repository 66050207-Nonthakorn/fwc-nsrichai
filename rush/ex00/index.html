<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nonthakorn Srichai - Home</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { background: #f5f7f4; }
    main.landing {
      width: min(1100px, calc(100% - 40px));
      min-height: 100svh;
      margin: auto;
      padding: 48px 0;
      display: grid;
      grid-template-columns: 1fr minmax(220px, 420px);
      align-items: center;
      gap: 60px;
    }
    .landing .job-title { margin-bottom: 24px; }
    .landing a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      color: #fff;
      background: #1e2521;
      font-weight: 700;
    }
    .landing a:focus-visible { outline: 3px solid #53645a; outline-offset: 4px; }
    @media (max-width: 700px) {
      main.landing { grid-template-columns: 1fr; align-content: center; gap: 40px; }
      .landing .photo { width: min(100%, 220px); }
    }
  </style>
</head>
<body>
  <main class="landing">
    <div>
      <h1>Nonthakorn Srichai</h1>
      <p class="job-title">Software Engineer Intern</p>
      <a href="resume.html">View my resume <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
